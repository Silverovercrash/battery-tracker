grid;grid-template-columns:repeat(3,1fr);gap:16px}.savebar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#edf2f7;padding:12px;border-radius:8px;margin-top:20px}.savebar small{display:block;margin-top:4px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid #e0e6ed}th{color:#58677a;background:#f5f7fa}details{margin-top:10px}summary{cursor:pointer;color:#2463b3;padding:8px 0}.event{border-left:3px solid #b7cce5;padding:4px 0 18px 18px;margin-left:6px}.event h3{margin:4px 0;font-size:17px}.notice{padding:12px;border-radius:8px;background:#e7f3eb;color:#14663d;margin-bottom:15px}.bar{height:22px;background:#3478bb;border-radius:4px;min-width:2px}.chartrow{display:grid;grid-template-columns:130px 1fr 70px;align-items:center;gap:12px;margin:20px 0}dialog{border:1px solid #cad5e0;border-radius:12px;max-width:560px;width:calc(100% - 28px);padding:24px}dialog::backdrop{background:#15263d80}.phone{max-width:430px!important}.phone .grid,.phone .fields{grid-template-columns:1fr}.phone table,.phone thead,.phone tbody,.phone tr,.phone td{display:block}.phone thead{display:none}.phone tr{border:1px solid #d7e0e8;margin-bottom:12px;border-radius:8px;padding:8px}.phone td{border:0;padding:5px}.phone td:before{content:attr(data-label) ' ';color:#58677a}.phone .savebar{position:sticky;bottom:8px;box-shadow:0 2px 12px #19324b22}.phone .chartrow{grid-template-columns:100px 1fr 55px}footer{padding:12px 0;font-size:13px;color:#58677a}

<div class="demo" id="connection">Akku-Tracker · Open-Source-Entwurf 0.1.0</div>
<header id="header"><div class="top"><div><h1>Akkus & Batterien</h1><span class="muted">Geräte, feste Verbünde und jeder Wechsel im Blick.</span><br><small class="muted">Open-Source-Entwurf 0.1.0</small></div><button onclick="phone()" id="phone">Handyansicht testen</button></div><nav class="tabs" id="tabs"></nav><label class="language-control" style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px">Language / Sprache <select id="tracker-language" aria-label="Language / Sprache" style="width:auto;min-height:36px;padding:5px 8px"><option value="en">English</option><option value="de">Deutsch</option></select></label></header>
<main id="main"></main><dialog id="dialog"></dialog>
<script>
window.AKKU_HA_MODE=new URLSearchParams(location.search).get('ha')==='1';
let haSaveSequence=0,haLatestSaveSequence=0,haLastSavedState=null;
const KEY='akku-tracker-oss-v1';const seed={batteries:[],devices:[],history:[]};let state;try{state=window.AKKU_HA_MODE?structuredClone(seed):(JSON.parse(localStorage.getItem(KEY))||structuredClone(seed))}catch{state=structuredClone(seed)}let tab='Geräte',message='',mobile=false;const $=s=>document.querySelector(s);let esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function store(){return persistTrackerState();}function days(s){return Math.max(0,Math.floor((new Date()-new Date(s+'T12:00:00'))/864e5))}function badge(s){return `<span class="badge ${s==='Reserve / bereit'?'ready':s==='Leer / Laden'?'empty':''}">${esc(uiText(s))}</span>`}function go(t){tab=t;message='';render()}function phone(){mobile=!mobile;$('#main').classList.toggle('phone',mobile);$('#header').classList.toggle('phone',mobile);setLocalizedText($('#phone'),()=>(mobile?'PC-Ansicht':'Handyansicht testen'))}
function render(){ setLocalizedHTML($('#tabs'),()=>(['Geräte','Batterien','Anlegen','Verlauf','Auswertung','Sicherung'].map(t=>`<button class="${tab===t?'active':''}" onclick="go('${t}')">${t}</button>`).join('')));setLocalizedHTML($('#main'),()=>((message?`<div class="notice" role="status">${esc(uiText(message))}</div>`:'')+views[tab]()));}
const views={
'Geräte':()=>`<div class="toolbar"><h2>Deine Geräte <small>(${state.devices.length})</small></h2><button class="primary" onclick="deviceForm()">＋ Gerät anlegen</button></div><div class="grid">${state.devices.map((d,i)=>`<article class="device"><h3>${esc(d.name)}</h3><small>${esc(d.place)} · ${d.count} Batterie${d.count>1?'n':''}</small><div>${badge(d.set?'Im Einsatz':'Nicht bestückt')}</div><p><b>${esc(d.set||'Noch keine Batterie eingelegt')}</b><br><small>${d.since?'Seit '+d.since.split('-').reverse().join('.')+' · bisher '+days(d.since)+' Tage':'Passende Batterie oder Verbund auswählen'}</small></p><details><summary>Batterie-IDs anzeigen</summary>${esc(state.batteries.filter(b=>b.set===d.set&&d.set||b.id===d.set).map(b=>b.id).join(', ')||'Keine zugeordnet')}</details><button class="${d.set?'':'primary'}" onclick="swapForm(${i})">${d.set?'Verbund / Batterie wechseln':'Einlegen'}</button><button onclick="tab='Verlauf';render()">Verlauf ansehen</button></article>`).join('')}</div>`,
'Batterien':()=>`<div class="toolbar"><h2>Batterien & Verbünde <small>(${state.batteries.length} Batterien)</small></h2><button class="primary" onclick="go('Anlegen')">＋ Batterien hinzufügen</button></div><input class="search" aria-label="Batterien suchen" placeholder="Gerät, Verbund, ID oder Marke suchen …" oninput="filterRows(this.value)"><p class="muted">Ein Verbund = eine Zeile. Spannungen in V je Zelle; unbekannte Werte bleiben leer (–).</p><div class="panel tablewrap"><table><thead><tr><th>Verbund / Batterie</th><th>Gerät</th><th>Basisdaten</th><th>Status</th><th>Spannung IN</th><th>Spannung OUT</th><th>Aktion</th></tr></thead><tbody>${batteryGroups().map(g=>{let b=g.items[0],d=state.devices.find(d=>d.set===g.key),h=state.history.find(h=>h.old===g.key),device=d?.name||h?.device||'Noch nicht zugeordnet';return `<tr class="batteryrow"><td data-label="Verbund / Batterie:"><b>${esc(g.key)}</b><br><small>${g.items.length} Batterie${g.items.length>1?'n':''}</small><details><summary>Einzelne Batterien</summary>${g.items.map(x=>`<div>${esc(x.id)} ${x.status!=='Im Einsatz'?`<button class="danger" onclick="removeBattery('${x.id}')">Löschen</button>`:''}</div>`).join('')}</details></td><td data-label="Gerät:"><b>${esc(device)}</b>${d?`<br><small>${esc(d.place)} · aktueller Einsatz</small>`:h?'<br><small>Letzter Einsatz</small>':''}</td><td data-label="Typ:">${esc(b.brand)} · ${esc(b.model)}<br><small>${esc(b.size)} · ${esc(b.chem)} · ${esc(b.capacity)} mAh</small></td><td data-label="Status:">${badge(b.status)}</td><td data-label="Spannung IN:"><b>${esc((d?d.voltage:h?.vstart)||'–')} V</b><br><small>${d?'Beim aktuellen Einlegen':h?'Letzter abgeschlossener Einsatz':'Noch kein Messwert'}</small></td><td data-label="Spannung OUT:"><b>${esc((!d&&h?.vend)||'–')} V</b><br><small>${d?'Noch im Einsatz':h?'Beim Entnehmen':'Noch kein Messwert'}</small></td><td data-label="Aktion:">${d?`<button onclick="swapForm(${state.devices.indexOf(d)})">Wechseln</button>`:`<button onclick="go('Geräte')">Gerät auswählen</button>`}</td></tr>`}).join('')}</tbody></table></div><button class="primary" onclick="go('Anlegen')">＋ Weitere Batterien hinzufügen</button>`,
'Anlegen':()=>`<section class="panel"><h2>Eine Vorlage. Beliebig viele Batterien.</h2><p class="muted">Basisdaten einmal ausfüllen. Jedes Exemplar erhält eine eigene ID und einen eigenen Verlauf.</p><form id="create" oninput="dirty();preview()" onsubmit="createBatteries(event)"><div class="fields">${field('Marke','brand','Beispielmarke')}${field('Modell','model','NiMH Standard')}${field('Größe','size','AA')}<label>Chemie<select name="chem"><option>NiMH</option><option>Alkali</option><option>Lithium-Ionen</option><option>Lithium 1,5 V</option><option>Sonstige</option></select></label>${field('Nennkapazität (mAh, optional)','capacity','1900','number')}${field('Anzahl insgesamt – inklusive Vorlage','count','3','number')}</div><hr style="border:0;border-top:1px solid #e1e7ed;margin:22px 0"><label>Verbundname (leer lassen für Einzelbatterien)<input name="set" placeholder="z. B. Wohnzimmer C"></label><p id="preview"></p><div class="savebar"><div><b id="saveinfo">Bereit zum Anlegen</b><small>Offline lokal; in HA gemeinsam gespeichert</small></div><button id="savebutton" class="primary" type="submit">Batterien anlegen</button></div></form></section>`,
'Verlauf':()=>`<section class="panel"><h2>Wechselverlauf</h2><p class="muted">Abgeschlossene Einsätze bleiben erhalten. Laufende Einsätze findest du bei den Geräten.</p>${state.history.map(h=>`<div class="event"><small>${esc(h.end.split('-').reverse().join('.'))} · ${esc(h.device)}</small><h3>${esc(h.old)} → ${esc(h.next)}</h3><p>${h.days} Tage im Einsatz · ${esc(h.start)} bis ${esc(h.end)}<br>Spannung je Zelle: ${esc(h.vstart||'–')} V → ${esc(h.vend||'–')} V</p></div>`).join('')}</section>`,
'Auswertung':()=>`<section class="panel"><h2>Laufzeit vergleichen</h2><label>Darstellung<select onchange="$('#chart').hidden=this.value==='Tabelle';$('#charttable').hidden=this.value!=='Tabelle'"><option>Balken</option><option>Tabelle</option></select></label><p class="muted">Nur abgeschlossene Einsätze. Beispieldaten, keine Prognose.</p><div id="chart">${state.history.map(h=>`<div class="chartrow"><span>${esc(h.old)}</span><div class="bar" style="width:${Math.max(2,h.days/Math.max(...state.history.map(x=>x.days),1)*100)}%"></div><b>${h.days} Tage</b></div>`).join('')}</div><div id="charttable" hidden>${state.history.map(h=>`<p>${esc(h.device)} · ${esc(h.old)}: <b>${h.days} Tage</b></p>`).join('')}</div></section>`,
'Sicherung':()=>`<section class="panel"><h2>Daten & Sicherung</h2><p>Dieser Entwurf speichert ausschließlich seine Beispieldaten in diesem Browser.</p><div class="row"><button class="primary" onclick="backup()">JSON-Backup herunterladen</button><button onclick="$('#restore').click()">JSON-Backup einlesen</button><input id="restore" hidden type="file" accept=".json" onchange="restore(this.files[0])"></div><p class="muted">Excel-Import und -Export sind für die vollständige Version vorgesehen. Im Bedienentwurf sind sie noch nicht enthalten.</p><hr><button class="danger" onclick="reset()">Beispieldaten wiederherstellen</button></section>`};
function field(label,name,value,type='text'){return `<label>${label}<input name="${name}" type="${type}" value="${value}" ${type==='number'?'min="1"':''} ${['brand','model','size','count'].includes(name)?'required':''}></label>`}function dirty(){$('#savebutton').className='warning';setLocalizedText($('#savebutton'),()=>('Batterien anlegen'));setLocalizedText($('#saveinfo'),()=>('Noch nicht gespeichert'))}function ids(n){let a=[],i=1;while(a.length<n){let id='BAT-'+String(i++).padStart(3,'0');if(!state.batteries.some(b=>b.id===id))a.push(id)}return a}function preview(){let f=new FormData($('#create')),n=Number(f.get('count'));setLocalizedText($('#preview'),()=>(n>=1&&n<=500?`Vorschau: ${n} Batterien · ${ids(n).slice(0,4).join(', ')}${n>4?' …':''}${f.get('set')?' · Verbund „'+esc(f.get('set'))+'“':''}`:'Bitte eine Anzahl zwischen 1 und 500 wählen.'))}
function createBatteries(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),n=Number(f.count);if(!Number.isInteger(n)||n<1||n>500)return alert(uiText('Bitte 1 bis 500 Batterien wählen.'));if(f.set&&state.batteries.some(b=>b.set===f.set.trim()))return alert(uiText('Dieser Verbundname ist bereits vergeben.'));let old=structuredClone(state);state.batteries.push(...ids(n).map(id=>({id,brand:f.brand,model:f.model,size:f.size,chem:f.chem,capacity:f.capacity,set:f.set.trim(),status:'Reserve / bereit'})));try{store();$('#savebutton').className='success';setLocalizedText($('#savebutton'),()=>('✓ Gespeichert'));$('#savebutton').disabled=true;setLocalizedText($('#saveinfo'),()=>(n+' Batterien erfolgreich angelegt'));}catch{state=old;$('#savebutton').className='danger';setLocalizedText($('#saveinfo'),()=>('Nicht gespeichert – Browserspeicher nicht verfügbar'))}}
function batteryGroups(){let groups=new Map();for(let b of state.batteries){let key=b.set||b.id;if(!groups.has(key))groups.set(key,{key,items:[]});groups.get(key).items.push(b)}return [...groups.values()]}function filterRows(v){document.querySelectorAll('.batteryrow').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(v.toLowerCase()))}function removeBattery(id){let b=state.batteries.find(b=>b.id===id);if(b.status==='Im Einsatz')return alert(uiText('Bitte zuerst aus dem Gerät entnehmen.'));if(!confirm(uiText(id+' aus dem Entwurf löschen?')))return;state.batteries=state.batteries.filter(b=>b.id!==id);store();render()}
function deviceForm(){setLocalizedHTML($('#dialog'),()=>(`<h2>Gerät anlegen</h2><form onsubmit="addDevice(event)">${field('Gerätename','name','')}${field('Ort','place','')}${field('Batterieplätze','count','3','number')}<p class="row"><button class="primary">Gerät speichern</button><button type="button" onclick="$('#dialog').close()">Abbrechen</button></p></form>`));$('#dialog').showModal()}function addDevice(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));state.devices.push({...f,count:Number(f.count),set:'',since:''});store();$('#dialog').close();render()}
function swapForm(i){let d=state.devices[i],sets=[...new Set(state.batteries.filter(b=>b.status==='Reserve / bereit').map(b=>b.set||b.id))].filter(s=>state.batteries.filter(b=>b.set===s||b.id===s).length===d.count);setLocalizedHTML($('#dialog'),()=>(`<h2>${d.set?'Wechseln':'Einlegen'} · ${esc(d.name)}</h2><p>${d.count} Plätze · aktuell: ${esc(d.set||'leer')}</p>${sets.length?`<form onsubmit="swap(event,${i})"><label>${d.count===1?'Batterie':'Passenden Verbund'} auswählen<select name="next">${sets.map(s=>`<option>${esc(s)}</option>`).join('')}</select></label>${field('Datum','date',new Date().toLocaleDateString('sv-SE'),'date')}${d.set?field('Endspannung je Zelle (V, optional)','end',''):''}${field('Anfangsspannung je Zelle (V, optional)','start','')}<p><small>Im Entwurf wird ein gemeinsamer Messwert je Zelle erfasst. Unterschiedliche Einzelwerte folgen in der vollständigen Version.</small></p><div class="row"><button class="primary">${d.set?'Wechsel speichern':'Einlegen speichern'}</button><button type="button" onclick="$('#dialog').close()">Abbrechen</button></div></form>`:`<p>Kein verfügbarer Satz mit ${d.count} Batterien vorhanden. Lege zuerst passende Batterien an.</p><button onclick="$('#dialog').close();go('Anlegen')">Batterien anlegen</button><button onclick="$('#dialog').close()">Schließen</button>`}`));$('#dialog').showModal()}
function swap(e,i){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),d=state.devices[i];if(d.since&&f.date<d.since)return alert(uiText('Das Wechseldatum liegt vor dem Einlegen.'));if(d.set){state.history.unshift({device:d.name,old:d.set,next:f.next,start:d.since,end:f.date,days:Math.round((new Date(f.date)-new Date(d.since))/864e5),vstart:d.voltage||'',vend:f.end});state.batteries.filter(b=>b.set===d.set||b.id===d.set).forEach(b=>b.status='Leer / Laden')}state.batteries.filter(b=>b.set===f.next||b.id===f.next).forEach(b=>b.status='Im Einsatz');d.set=f.next;d.since=f.date;d.voltage=f.start;store();$('#dialog').close();message='✓ Einsatz gespeichert. Gerätestatus und Batteriestatus wurden aktualisiert.';render()}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:1,data:state},null,2)],{type:'application/json'}));a.download='Akku-Entwurf-Backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(file){if(!file)return;try{let x=JSON.parse(await file.text());if(x.version!==1||!Array.isArray(x.data?.batteries)||!Array.isArray(x.data?.devices)||!Array.isArray(x.data?.history))throw Error();if(!confirm(uiText('Entwurfsdaten durch diese Sicherung ersetzen?')))return;state=x.data;store();message='✓ Entwurfs-Backup eingelesen';render()}catch{alert(uiText('Sicherung konnte nicht eingelesen werden.'))}}function reset(){if(confirm(uiText('Nur die Daten dieses Entwurfs zurücksetzen?'))){state=structuredClone(seed);store();render()}}render();
</script><script>initializeTrackerI18n();</script><script src="akku-sync.js?v=0.1.0"></script><script src="vendor/xlsx.full.min.js"></script><script src="akku-erweiterung.js?v=oss-0.1.0"></script><script src="catalog-data.js"></script><script src="akku-catalog.js?v=0.1.0"></script><script src="akku-einzeltabelle.js"></script><script src="akku-kompakt.js?v=geraeteauswahl3-symbol"></script><script src="akku-direkt-anlegen.js"></script><script src="akku-etiketten.js?v=62mm"></script><script src="akku-geraete-liste.js?v=oss-0.1.0"></script><script src="akku-device-ui.js?v=oss-0.1.0"></script><script src="akku-runtime.js?v=0.1.0"></script></html>
